name: Generate SDK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['openapi.yaml', 'openapitools.json', '.github/workflows/generate.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate (typescript-axios)
        run: |
          docker run --rm -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.10.0 \
            generate -i /local/openapi.yaml -g typescript-axios -o /local \
            --skip-validate-spec \
            --additional-properties=npmName=@griffnode/js-sdk,npmVersion=1.0.1,supportsES6=true,useSingleRequestParameter=true,gitUserId=GriffNode,gitRepoId=js-sdk
      - name: Fix package.json metadata (generator placeholder breaks npm provenance)
        run: |
          npm pkg set repository.type=git
          npm pkg set repository.url="git+https://github.com/GriffNode/js-sdk.git"
          npm pkg set homepage="https://docs.griffnode.com/reference"
          npm pkg set bugs.url="https://github.com/GriffNode/js-sdk/issues"
      - name: Commit regenerated SDK
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: regenerate SDK from openapi.yaml"
          git pull --rebase --autostash
          git push
